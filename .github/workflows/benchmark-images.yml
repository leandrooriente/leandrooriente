name: Benchmark image builds

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    paths:
      - eleventy.config.js
      - scripts/images.mjs
      - scripts/styles.mjs
      - .github/scripts/benchmark-images.mjs
      - .github/workflows/benchmark-images.yml
  workflow_dispatch:
    inputs:
      diagnostics:
        description: Include native threading and AVIF effort/quality diagnostics
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: image-build-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'benchmark-images'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out the baseline separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: tmp/base
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false

      - name: Verify shared dependencies and install them once
        run: |
          cmp package-lock.json tmp/base/package-lock.json
          npm ci

      - name: Benchmark isolated baseline and candidate builds
        run: node .github/scripts/benchmark-images.mjs
        env:
          BENCH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          BENCH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BENCH_IMAGE_DIAGNOSTICS: ${{ github.event_name == 'pull_request' || inputs.diagnostics }}
          BENCH_ALLOW_AVIF_CHANGES: 'true'

      - name: Show the benchmark summary
        if: always()
        run: |
          if [[ -f tmp/image-build-benchmark/results/summary.md ]]; then
            cat tmp/image-build-benchmark/results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save benchmark reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-build-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/image-build-benchmark/results/
          if-no-files-found: warn
          retention-days: 30
