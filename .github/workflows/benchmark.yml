name: Benchmark build tools

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/benchmark.yml
      - .github/scripts/benchmark-*.mjs

permissions:
  contents: read

concurrency:
  group: build-tool-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  measure:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: node22-npm, node: '22.23.3', manager: npm, runtime: node }
          - { id: node24-npm, node: '24.22.0', manager: npm, runtime: node }
          - { id: node22-npm-fast, node: '22.23.3', manager: npm, runtime: node }
          - { id: node22-bun, node: '22.23.3', manager: bun, runtime: node }
          - { id: bun-bun, node: '22.23.3', manager: bun, runtime: bun }
          - { id: node22-pnpm, node: '22.23.3', manager: pnpm, runtime: node }
    env:
      BENCH_VARIANT: ${{ matrix.id }}
      BENCH_MANAGER: ${{ matrix.manager }}
      BENCH_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up reference Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false

      - name: Remember reference executable
        id: reference-node
        run: echo "path=$(command -v node)" >> "$GITHUB_OUTPUT"

      - name: Select Node 24
        if: matrix.node == '24.22.0'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          package-manager-cache: false

      - name: Set up Bun
        if: matrix.manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
          no-cache: true

      - name: Set up pnpm
        if: matrix.manager == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'
          run_install: false
          cache: false

      - name: Measure clean package installs
        id: installs
        run: node .github/scripts/benchmark-install.mjs

      - name: Identify installed encoder
        id: encoder
        if: steps.installs.outputs.ready == 'true'
        working-directory: tmp/build-tools/${{ matrix.id }}/site
        run: node scripts/image-cache.mjs >> "$GITHUB_OUTPUT"

      - name: Restore production image cache read-only
        if: steps.installs.outputs.ready == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/image-cache
          key: images-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.encoder.outputs.fingerprint }}-benchmark-${{ github.run_id }}-${{ matrix.id }}
          restore-keys: |
            images-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.encoder.outputs.fingerprint }}-

      - name: Measure runtime and verify output
        if: steps.installs.outputs.ready == 'true'
        run: node .github/scripts/benchmark-runtime.mjs
        env:
          BENCH_REFERENCE_NODE: ${{ steps.reference-node.outputs.path }}

      - name: Save raw results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-tools-${{ matrix.id }}
          path: tmp/benchmark-results/
          retention-days: 30

  compare:
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-tools-*
          path: tmp/benchmark-collected
          merge-multiple: true

      - name: Compare results and output hashes
        if: always()
        run: node .github/scripts/benchmark-summary.mjs

      - name: Save combined report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-tools-report
          path: tmp/benchmark-report/
          retention-days: 30
